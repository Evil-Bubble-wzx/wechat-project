name: tingyue-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tingyue
      POSTGRES_USER: tingyue
      POSTGRES_PASSWORD: tingyue-local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tingyue -d tingyue"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tingyue-local
      MINIO_ROOT_PASSWORD: change-me-local-only
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 tingyue-local change-me-local-only; do sleep 1; done;
        mc mb --ignore-existing local/tingyue-incoming &&
        mc mb --ignore-existing local/tingyue-published &&
        (mc admin user add local tingyue-app-local tingyue-app-secret-local || mc admin user enable local tingyue-app-local) &&
        mc admin policy create local tingyue-app /config/app-policy.json &&
        mc admin policy attach local tingyue-app --user tingyue-app-local &&
        mc version enable local/tingyue-published &&
        mc ilm import local/tingyue-incoming < /config/incoming-lifecycle.json &&
        mc ilm import local/tingyue-published < /config/published-lifecycle.json
    volumes:
      - ./ops/minio:/config:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
